name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.4.1 更新
          - **带截图的笔记导出后不再丢图**：笔记正文里的图片引用一直写的是 ./images/xxx.jpg，而截图落在任务目录的 frames/ 下——那个目录从来没存在过，所以只有网页预览（前端渲染时改写地址）能看到图，导出的 Markdown、导出的 HTML 和归档笔记全是坏链。现在：引用与磁盘一致；GET /api/download/ 在正文引用了真实存在的截图时返回「笔记.md + frames/」的 zip（包内引用统一成 ./frames/，打包放到线程里做，避免卡住 2 秒一次的任务轮询），不带截图仍是单个 .md；HTML 导出由前端把图片逐张取回成 data URI，产出自包含单文件；归档到 workspace/notes/ 的那份引用改写成指向任务目录的相对路径（不复制图片，删掉任务后归档里的图会失效）；1.4.0 及更早写下的 ./images/ 两种写法前后端都认，历史任务不必重跑，重新导出即可。下载文件名改为跟随笔记标题（此前一律叫 video_summary_时间戳.md）
          - **Whisper 档位口径按本机实测重写**：下拉框把 paraformer-zh（中文最快最准、仅中文）与 belle-turbo-zh（whisper 系里中文最好）标为「中文推荐」，把 medium / large-v3 / turbo 标为「不推荐 · 说明」——中文 CER 已被前两档超过，且 large-v3 要 3.1GB、turbo 的中文相对 large-v3 还有退化；**选项一个都没删**，多语言视频仍靠它们。这段提示也会连带出现在「未缓存，首次使用需下载 ~xGB」的确认弹窗里；随 Release 分发的手动导入说明新增一节：追求中文精度请先换档而不是回头下大模型（给出 belle 的 CT2 int8 五个文件直链，preprocessor_config.json 必带）
          - **修复 paraformer-zh 手动导入指向错目录**：该引擎读的是 _model_cache/sherpa/ 下 asr、punc、vad 三份组件，而 /api/whisper-models/manual-folder 一直返回程序根本不读的 manual/paraformer-zh，用户照提示放好文件仍显示「未缓存」。响应统一成 folders 列表（每项带名称、文件清单、下载页、放置目录）加一个 open_path（whisper 系一条、paraformer 三条，只开一个文件管理器窗口），标点那份标明可缺（缺了自动降级为无标点转写）
          - **MCP 的可发现性**：侧栏新增「让 agent 接入（MCP）」折叠卡，SSE 地址由页面 origin 现算（服务不在 8000 也对），一键复制地址或一段可直接导入客户端的 JSON 配置；品牌区下方加常驻状态芯片、主区加首次提示条（看过即落盘不再提）。/api/health 新增 dependencies.mcp_sse（挂载成功才为真），本机没装 mcp 依赖时界面直说「连不通」而不是给一个死地址
          - **内联 API Key 不再明文外溢**：失败文案有三条出口（task 的 error 字段、任务日志「处理失败：…」、系统通知），三者都会随 GET /api/task/ 与 MCP 的 get_task_status / wait_for_task 回到客户端，而未知异常时友好文案函数是原样返回底层文本的——网关爱把收到的 Authorization 回显进 4xx body，明文 Key 就这样落进 workspace/任务目录/task.json。现在三条出口与 summarizer 的告警在落盘前统一过 redact_secrets：sk- 前缀、字段名回显（api_key、authorization、bearer、token、sessdata、bili_jct，字段名以单词边界界定，避免咬坏 tokenizer.json），以及调用方手里那把明文的整串替换。Skill 侧新增 --api-key -（从标准输入读一行）与环境变量 VIDEOTONOTES_LLM_API_KEY，写在命令行那种会当场提示会留在 shell 历史与进程列表；脚本对自己看到的每段文本先脱敏再打印
          - **发布流程**：一批改动开一个 release/X.Y.Z 分支，决定发布才以 --no-ff 合入 main 并打 tag，main 从此只对应已发布内容
          - **验证**：本机 pytest 296 通过（本批新增 10 条）；带截图任务的导出在真浏览器与打包 exe 上逐项核过（预览 3 图全加载、HTML 内联出 3 个 data URI、zip 成员与包内引用逐个可解析、旧 ./images/ 写法照样打包）；用「任何请求都回 401 并回显 Authorization」的假网关做活体检查，确认明文 Key 不在 error、日志、task.json、_app.log 里；paraformer 手动导入弹窗在打包态返回三份组件目录；打包态烟测 4/4 PASS（版本号、首页、DPAPI 无明文、crypt32 未被剥）

          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
