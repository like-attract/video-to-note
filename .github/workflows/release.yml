name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.2.0 更新
          - **B 站多分 P 视频**：粘贴多分 P 链接（不带 ?p）会把全部分 P 合并成一份带「【P1 分P名】」分段标记、时间轴连续的笔记；链接带 ?p=N 则只处理对应分 P（此前只会识别第一个分 P）
          - **取消真正生效**：语音转写改为按音频段协作式中止，点取消后当前段落结束即停，不再等整段转写跑完
          - **修复误报**：已登录 B 站但视频本身没有 AI 字幕时，不再错误提示“需要填写 SESSDATA”；字幕接口异常如实显示
          - **Whisper 模型手动导入**：下载慢/反复失败时，界面一键打开导入目录、放入模型文件后自动识别

          <details>
          <summary>历史版本摘要</summary>

          - **v1.1.8**：运行模式与应用版本隔离、最近任务滚动条、详细复原元信息去重、自定义 Base URL 错误诊断。
          - **v1.1.7**：抖音单条公开分享链接、浏览器验证回退、转写复用和已取消任务删除。
          - **v1.1.6**：Whisper 下载确认记忆和自定义工作目录修复。
          - **v1.1.5**：旧缓存页面、MCP SSE 和启动告警修复。
          - **v1.1.4**：笔记元信息、托盘更新检查、B 站下载稳定性和 Whisper 回退改进。
          - **v1.1.3 及更早**：B 站 412 处理、LLM 测试、MCP、任务恢复和多格式导出等基础能力。

          </details>
          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
