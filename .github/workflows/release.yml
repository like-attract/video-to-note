name: Release

on:
  push:
    tags:
      - "v*"
  # 手动跑一次"只构建、不发版"：产物走 artifact，给人测包用。
  # 补这个入口是因为 ci.yml 不出包、release.yml 又只在 tag 上出包，于是"发版前想给人
  # 测包"只剩本地打这一条路——而本地打会把构建机 System32 的 VC++ 运行时原样收进 exe
  # 并盖过用户自己那份（2026-10 群测两个转写引擎都 0xC0000005 就是这么来的）。
  # 触发后 publish 这个 job 会被下面的 if 跳过，不会建 Release、不会刷 feed。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    # workflow_dispatch 的手动跑只到 build-windows 为止：没有 tag 就没有版本号，
    # 让它跑下去会拿分支名去 gh release create
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.4.7 更新

          - **导出多一种 Word 文档**：结果区的导出菜单新增「Word 文档 (.docx)」，标题层级、列表、加粗、表格和笔记里的定时截图都会带过去，Word / WPS 打开即可继续编辑。
          - **选了没下载过的转写模型，不再只能干等**：提交时会弹窗说明模型大小，推荐手动导入——直接打开要放文件的文件夹，列出该下哪些文件、下载页在哪；也可以选「自动下载」，弹窗里显示当前文件已下载多少、共多少。下载失败时同样给出手动导入入口，不会让整条任务陪着失败。
          - **修：B 站分 P 音频偶发「下载字节数不完整」直接判任务失败**：下载中途断流时会自动改走 B 站播放地址直连，带断点续传和重试，下载完整后才进入转写。
          - **修：长一点的视频笔记只写到一半就停**：笔记停在 36:35、转写一直到 01:03:15 这类情况，现在会识别出真的丢了结尾，并按小段把缺失部分补写完整；只是省略时间戳、内容其实写全了的笔记不会被强行重写。
          - **验证**：本机 pytest 399 通过；Word 导出用本机 Word 打开核验（标题、表格、截图齐全）；模型弹窗在隔离 workspace 的浏览器里走过手动导入、自动下载进度与取消；B 站回退与尾部续写由单元测试覆盖。**没验到的**：用户反馈的那条 B 站分 P 链接与真实长视频模型的截断行为，发版前用打包产物再走一次。

          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
