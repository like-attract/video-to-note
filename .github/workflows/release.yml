name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.2.2 更新
          - **Agent Skill 接入**：新增 skills/video-to-note/（SKILL.md + 一条命令脚本），Claude Code、pi 等支持技能的 agent 可直接一句话生成视频笔记——与桌面应用、MCP 并列的第三种接入形态
          - **任务结果 Windows 通知**：打包模式下任务完成/失败时通过托盘气泡弹系统通知，无需盯页面等待
          - 仓库与文档定位重写：明确「本地优先的视频→结构化笔记服务，三种接入形态」

          <details>
          <summary>历史版本摘要</summary>

          - **v1.2.1**：取消真正立即生效（LLM 流式/下载钩子/模型下载逐块取消）、上传上限 2GB + 超大视频自动提音频、Whisper base 模型导入包。
          - **v1.2.0**：B 站多分 P 视频、语音转写段粒度取消、B 站无字幕误报修正、Whisper 手动导入模型界面。
          - **v1.1.8**：运行模式与应用版本隔离、最近任务滚动条、详细复原元信息去重、自定义 Base URL 错误诊断。
          - **v1.1.6**：Whisper 下载确认记忆和自定义工作目录修复。
          - **v1.1.5**：旧缓存页面、MCP SSE 和启动告警修复。
          - **v1.1.4**：笔记元信息、托盘更新检查、B 站下载稳定性和 Whisper 回退改进。
          - **v1.1.3 及更早**：B 站 412 处理、LLM 测试、MCP、任务恢复和多格式导出等基础能力。

          </details>
          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
