name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.4.0 更新
          - **长视频不再丢内容**：约 80 分钟（2.4 万字）以上的视频改为按时间顺序逐段完整记录——旧管线「逐段压缩 → 多层归并 → 一次成稿」的材料与输出上限都是与时长无关的常数，3 小时课因此丢约 2 小时。现在每段写完自动续写，仍失败就把该段原文附在笔记里并注明原因，内容不再消失；笔记带「内容概览 + 带时间范围的目录」，小标题写成「标题 [起点-终点]」（短视频同样）。80 分钟以内走的仍是原路径，行为与耗时不变
          - **成稿速度提升一个量级**：DeepSeek 兼容通道的「自动」推理强度全面关闭深度思考。实测：3 小时 6.2 万字真题课 8 分 22 秒成稿 4.8 万字（90 秒块覆盖 119/120、15 道真题结论数字全部在稿）；28 分钟视频全程 24 分钟；8 分钟视频 95 秒。要深度思考可显式选「更高/最高」。两道护栏：思考额度抬高 5 倍防「思考两万字后正文为 0」，流被网关中途掐断时自动重投一次
          - **笔记公式可渲染了**：预览内置 KaTeX（本地打包、不联网），公式统一为 Markdown 通用的 \$...\$ / \$\$...\$\$ 定界符——应用内预览直接渲染，导出的 .md 在 Typora/Obsidian 里也一样；旧写法 \(...\) \[...\] 会自动归一
          - **本地转写更快、更透明**：新增 paraformer-zh（仅中文，80 分钟视频转写约 4 分钟，比原默认快约 9.6 倍，自动分段加标点）与 belle-turbo-zh（whisper-turbo 中文优化版，质量优于 large-v3，自带标点）；CPU 档解码调优约 2.3 倍；转写阶段每 30 秒回报「已推进到 mm:ss / 总时长」，不再像卡死；turbo 自动下载从未成功的问题已修，「手动导入」链接按所选模型给对仓库
          - **写笔记前先读懂背景**：自动读取视频简介辅助模型理解主题与来源——识别这是哪门课、谁的课，按正确写法用术语；热门评论刻意不采集（如今多为玩梗，误导风险大于信息量）
          - **B 站分 P 更顺手**：提交前可显式勾选要处理的分 P，面板显示编号/名称/时长并汇总已选时长（默认全不选——42 P 的课误点「开始生成」就是几十小时转写）；同一视频重新处理时默认沿用上次的勾选，不必再勾一遍
          - **模型档案一键改名**：档案下拉旁新增「重命名」按钮，多份自定义接口不再一屏「新的自定义接口」
          - **报错不再张冠李戴**：B 站/本地任务在生成笔记阶段被模型接口拒绝时，不再误报「抖音媒体地址已过期」——提示会指向真正要检查的 Key / Base URL / 模型名，日志末尾附脱敏的底层错误；「关闭深度思考」在 ModelScope 等只认档位取值的网关上不再 400 报错
          - **杂项**：最近任务写明「已用时 / 共耗时」；「补充点评与分析」阶段撞限流自动退避重试，不再把 96% 进度的任务判死；开发脚本 start.ps1 启动后自动打开页面、stop.ps1 -All 清扫孤儿实例

          <details>
          <summary>历史版本摘要</summary>

          - **v1.3.5**：界面新增「仅转录字幕」输出（全程不调大模型、不需要 Key，字幕稿可一键改走笔记路线）；转录出口同步开放给 MCP / Skill（transcribe_video + get_transcript）；历史失败任务的字幕稿照样能取；本地视频首次上传即正常（不再必须失败一次重试）、上限真正放开到 2 GB；GPU 缺 CUDA 运行库自动退回 CPU；「待处理」任务可删除。
          - **v1.3.0**：API Key 与 B 站凭据按接口地址「保存到本机」（Windows 用系统 DPAPI 加密落盘、复用前校验地址、输入框旁新增密钥状态芯片）；模型档案各自记忆所选模型、自定义接口可保存多个命名档案、非敏感设置改动即保存；取消任务在任意阶段秒级生效（实测 18.6s → 0.02s）；修复切换 Provider 时模型 ID 串写与早期失败让任务卡在 processing；MCP 新增只读工具 list_llm_keys，save_llm_config 支持 label，get_saved_config 增加 endpoints / key_storage。
          - **v1.2.3**：B 站 412 风控自动回退到 api.bilibili.com 开放接口（含多分 P 与预览流，Issue #1）、「详细复原」卡在生成阶段的三道护栏、生成进度心跳、推理强度按风格自适应、思考参数被网关拒绝时自动降级并记住结论。
          - **v1.2.2**：Agent Skill 接入（skills/video-to-note/，一句话生成笔记）、任务完成/失败的 Windows 托盘通知、仓库与文档定位重写。
          - **v1.2.1**：取消真正立即生效（LLM 流式/下载钩子/模型下载逐块取消）、上传上限 2GB + 超大视频自动提音频、Whisper base 模型导入包。
          - **v1.2.0**：B 站多分 P 视频、语音转写段粒度取消、B 站无字幕误报修正、Whisper 手动导入模型界面。
          - **v1.1.8**：运行模式与应用版本隔离、最近任务滚动条、详细复原元信息去重、自定义 Base URL 错误诊断。
          - **v1.1.6**：Whisper 下载确认记忆和自定义工作目录修复。
          - **v1.1.5**：旧缓存页面、MCP SSE 和启动告警修复。
          - **v1.1.4**：笔记元信息、托盘更新检查、B 站下载稳定性和 Whisper 回退改进。
          - **v1.1.3 及更早**：B 站 412 处理、LLM 测试、MCP、任务恢复和多格式导出等基础能力。

          </details>
          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
