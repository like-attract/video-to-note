name: Release

on:
  push:
    tags:
      - "v*"
  # 手动跑一次"只构建、不发版"：产物走 artifact，给人测包用。
  # 补这个入口是因为 ci.yml 不出包、release.yml 又只在 tag 上出包，于是"发版前想给人
  # 测包"只剩本地打这一条路——而本地打会把构建机 System32 的 VC++ 运行时原样收进 exe
  # 并盖过用户自己那份（2026-10 群测两个转写引擎都 0xC0000005 就是这么来的）。
  # 触发后 publish 这个 job 会被下面的 if 跳过，不会建 Release、不会刷 feed。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    # workflow_dispatch 的手动跑只到 build-windows 为止：没有 tag 就没有版本号，
    # 让它跑下去会拿分支名去 gh release create
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.4.6 更新

          - **字幕可以导成 .srt**：结果区的导出菜单新增「字幕 (.srt)」，一条字幕对应转录里的一段，时间码按标准 SubRip 写（序号从 1 起、毫秒三位补零、跨过一小时进小时位），VLC / PotPlayer / 剪映 / Premiere 直接读。接口与 MCP 同步开放 GET /api/task/{id}/transcript?output_format=srt，与 markdown 一样返回 JSON 包裹的正文，批量归档不必自己拼时间码。
          - **只有字幕也能生成笔记**：来源类型新增「字幕文件」，传 .srt / .vtt 就直接进生成笔记——不下载视频、不抽音频、不跑本地转写；标题取字幕文件名，时长取字幕末尾。读不出带时间轴的文本会在选完文件当场说清，不会等任务跑到一半才失败。
          - **B 站扫码登录一次就够**：扫码成功后凭据自动加密存进本机，卡片显示「本机已存有凭据」并给出「清除本机凭据」；此后打开页面直接可用，也不会再弹提示条劝已经存过的人重扫。手填的凭据照旧只在本次页面内存中。
          - **把链接交给 agent 时软件没开也能用**：技能脚本发现本机没有服务时，会在后台拉起一个无头实例（不弹窗口、不进托盘）再继续提交任务；它闲置够久且没有在建任务时自己退出，不用去任务管理器找。
          - **修：个别电脑上「页面打得开、按钮全没反应、主题锁死在暗色」**：根因在那台机器的注册表把 .js 的文件类型写成 text/plain，而本服务带 nosniff 安全头，浏览器于是拒绝执行全部页面脚本——HTML 与 CSS 照常渲染，所以看着像界面坏了，重装与强刷都救不了。前端资源的类型现在由程序钉死，不再交给操作系统猜。
          - **验证**：本机 pytest 383 通过。字幕导入导出与 B 站凭据卡片各走过一轮 headless Edge 真机核验（含"明文不进 DOM"与"清除后提示条回来"）；打包产物实测包内 VC++ 运行时为 14.44.35208，发布前烟测通过。**没验到的**：无头实例的自动退出、以及"无头父进程起转写工人"这条链要在 CI 产物上再走一次；上面那条注册表故障的根因尚未在报障的那台机器上取证，本机是按同条件复现的。

          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
