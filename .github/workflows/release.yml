name: Release

on:
  push:
    tags:
      - "v*"
  # 手动跑一次"只构建、不发版"：产物走 artifact，给人测包用。
  # 补这个入口是因为 ci.yml 不出包、release.yml 又只在 tag 上出包，于是"发版前想给人
  # 测包"只剩本地打这一条路——而本地打会把构建机 System32 的 VC++ 运行时原样收进 exe
  # 并盖过用户自己那份（2026-10 群测两个转写引擎都 0xC0000005 就是这么来的）。
  # 触发后 publish 这个 job 会被下面的 if 跳过，不会建 Release、不会刷 feed。
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    # workflow_dispatch 的手动跑只到 build-windows 为止：没有 tag 就没有版本号，
    # 让它跑下去会拿分支名去 gh release create
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # heredoc 不带引号：正文里的 $ 必须写成 \$，否则 $$ 会被展开成 shell 进程号（v1.4.0 实测踩到）
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.4.8 更新

          - **paraformer-zh 转写有了实时进度**：第一段识别完成就开始显示「已推进到 mm:ss / 总时长（xx%）」，之后每 30 秒更新一次，不再从加载模型一直干等到转写完成。B 站 AI 字幕任务不受影响。
          - **长视频用 base 模型时会主动建议换更合适的**：视频超过 20 分钟且确实需要语音转写时，会推荐 paraformer-zh（最快、中文更准）或 belle-turbo-zh（精度更好但更慢）。点「改用」会先停止这次 base 任务：模型已缓存就直接用它重新转写；未缓存会打开模型导入/下载弹窗，装好后自动继续，并复用原视频信息与音频。只想关闭提示可点「继续用 base」，右上角 × 会取消本次任务。
          - **修：Belle 长音频后半段变乱码**：Belle 在 CPU 长音频上可能从某一段开始重复输出无意义内容，后段整段不可用。现在长音频转写更稳定；如果仍检测到连续乱码，会在生成笔记前停下，并在 paraformer 已缓存时自动改用它重转，否则提示换模型，不再拿坏转录去消耗大模型。
          - **修：详细笔记结尾补写位置不准**：当模型写到一半被截断、但最后一个小标题标了更晚的时间时，补写会从正文实际停下的位置继续，避免中间一段内容既不在正文也不在补遗里。
          - **长笔记更不容易被输出额度截断**：提高 DeepSeek 官方通道与兼容网关的输出额度（官方 32K / 兼容 16K），长一点的中短视频成稿更稳；通道不接受时会自动降级，不影响任务完成。
          - **修：托盘「检查更新」的弹窗无法关闭**：点确定或右上角叉都能正常关闭，不再只能从任务栏结束程序。
          - 其他一些细节与小问题修复。

          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
