name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.3.0 更新
          - **API Key 可以「保存到本机」**：按接口地址保管，Windows 上用系统 DPAPI 加密落盘（其他平台明文保存并在界面如实标注）。复用前会校验目标地址与保存时一致，不会把 A 网关的 Key 发给 B；不点保存时 Key 只留在当前页面内存里。输入框旁新增密钥状态芯片：本机已存 sk-x****（档案名）/ 未保存 / 无法解密
          - **模型档案**：内置 Provider 各自记住所选模型；自定义接口可保存多个命名档案（名称 + 地址 + 模型）。非敏感设置改动即自动保存，「保存偏好」按钮取消（保留「恢复默认」，且不清除本机已存 Key）
          - **B 站凭据也不再明文落盘**：save_bilibili_credentials 保存的 SESSDATA / bili_jct 走同一套本机加密；换机器或换 Windows 账户后解不开时，任务会明确报「本机 B 站凭据无法解密」并提示重新扫码，而不是悄悄改用匿名请求
          - **取消任务在任意阶段秒级生效**：以前在「读取视频信息」「查找平台字幕」阶段点取消要等十几秒，最后还会误报成「处理失败：timed out」；现在任意阶段都会立即进入「已取消」，排队等待中的任务同样能取消（实测 18.6s → 0.02s）
          - **修复切换 Provider / 自定义档案时模型 ID 串写**（A 档案的模型出现在 B 档案输入框里）；「测试连接」不再把已保存的 Key 用到调用方另给的地址上；早期失败（读凭据、取视频信息）现在也会正常写入终态，不会让任务卡在 processing
          - **MCP 与 Agent Skill**：新增只读工具 list_llm_keys；save_llm_config 支持 label；get_saved_config 增加 endpoints / key_storage（原有字段形状不变）；Skill 脚本在本机恰好只有一个地址存了 Key 时可省略 --api-key，失败提示会点名接口地址

          <details>
          <summary>历史版本摘要</summary>

          - **v1.2.3**：B 站 412 风控自动回退到 api.bilibili.com 开放接口（含多分 P 与预览流，Issue #1）、「详细复原」卡在生成阶段的三道护栏、生成进度心跳、推理强度按风格自适应、思考参数被网关拒绝时自动降级并记住结论。
          - **v1.2.2**：Agent Skill 接入（skills/video-to-note/，一句话生成笔记）、任务完成/失败的 Windows 托盘通知、仓库与文档定位重写。
          - **v1.2.1**：取消真正立即生效（LLM 流式/下载钩子/模型下载逐块取消）、上传上限 2GB + 超大视频自动提音频、Whisper base 模型导入包。
          - **v1.2.0**：B 站多分 P 视频、语音转写段粒度取消、B 站无字幕误报修正、Whisper 手动导入模型界面。
          - **v1.1.8**：运行模式与应用版本隔离、最近任务滚动条、详细复原元信息去重、自定义 Base URL 错误诊断。
          - **v1.1.6**：Whisper 下载确认记忆和自定义工作目录修复。
          - **v1.1.5**：旧缓存页面、MCP SSE 和启动告警修复。
          - **v1.1.4**：笔记元信息、托盘更新检查、B 站下载稳定性和 Whisper 回退改进。
          - **v1.1.3 及更早**：B 站 412 处理、LLM 测试、MCP、任务恢复和多格式导出等基础能力。

          </details>
          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
