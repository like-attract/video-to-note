name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.3.5 更新
          - **只要字幕稿，不必先配 Key**：界面新增输出类型「仅转录字幕」——选中后笔记风格等设置自动收起，任务只读平台字幕或本地 Whisper 转写，全程不调用大模型、不需要任何 API Key。产出带时间轴的字幕稿，留在「最近任务」里（标题前带「转录」标记）随时回看、复制或下载，之后还能一键改走笔记路线，转录不会重跑
          - **接上 MCP / Skill 之后，整理方式随你**：同一条转录出口对 agent 开放（MCP 工具 transcribe_video + get_transcript、Skill 参数 --transcript-only）。拿到文字稿后，"重点把某一节讲透""重复的合并、跳步的补上推导""视频没讲清的地方补充背景和例子"这类宽松的后续指令都交给客户端的模型完成，结构不由本机决定
          - **历史任务的转录可以直接取走**：只看转录产物在不在，不看任务状态——当时在生成笔记那一步失败的任务，字幕稿照样能取，不必重跑一遍下载和转写
          - **本地视频第一次放进不再必然失败**：此前上传后会把后端目录里的 input.mp4 当"链接"提交，被判"无法识别视频链接"，表现为必须先失败一次、点重试才跑通（v1.2.1 起就在，不是本批引入）；现在提交只带上传任务 ID，同时不再多出一条 input 任务，历史与笔记标题也改用你的原始文件名
          - **本地视频上限真正放开到 2 GB**：后端早就是 2048 MB，界面的判点和文案还卡在 500 MB；现在上限由后端下发，两端一起变，改 .env 的 MAX_UPLOAD_MB 会同步反映到上传提示
          - **GPU 缺 CUDA 运行库时退回 CPU 继续转写**：Library cublas64_12.dll is not found 这类机器（驱动正常、只缺 cuBLAS/cuDNN）不再让任务死在第 4 步，会自动改用 CPU 跑完并在运行记录里写明原因与补救办法；确认不可用后本进程后续任务直接走 CPU，不再每个任务重付一次注定失败的初始化
          - **"待处理"任务能删了**：上传成功但从未开始处理的任务此前没有删除入口，重启后还会恢复回来，永久挤占「最近任务」的 20 条

          <details>
          <summary>历史版本摘要</summary>

          - **v1.3.0**：API Key 与 B 站凭据按接口地址「保存到本机」（Windows 用系统 DPAPI 加密落盘、复用前校验地址、输入框旁新增密钥状态芯片）；模型档案各自记忆所选模型、自定义接口可保存多个命名档案、非敏感设置改动即保存；取消任务在任意阶段秒级生效（实测 18.6s → 0.02s）；修复切换 Provider 时模型 ID 串写与早期失败让任务卡在 processing；MCP 新增只读工具 list_llm_keys，save_llm_config 支持 label，get_saved_config 增加 endpoints / key_storage。
          - **v1.2.3**：B 站 412 风控自动回退到 api.bilibili.com 开放接口（含多分 P 与预览流，Issue #1）、「详细复原」卡在生成阶段的三道护栏、生成进度心跳、推理强度按风格自适应、思考参数被网关拒绝时自动降级并记住结论。
          - **v1.2.2**：Agent Skill 接入（skills/video-to-note/，一句话生成笔记）、任务完成/失败的 Windows 托盘通知、仓库与文档定位重写。
          - **v1.2.1**：取消真正立即生效（LLM 流式/下载钩子/模型下载逐块取消）、上传上限 2GB + 超大视频自动提音频、Whisper base 模型导入包。
          - **v1.2.0**：B 站多分 P 视频、语音转写段粒度取消、B 站无字幕误报修正、Whisper 手动导入模型界面。
          - **v1.1.8**：运行模式与应用版本隔离、最近任务滚动条、详细复原元信息去重、自定义 Base URL 错误诊断。
          - **v1.1.6**：Whisper 下载确认记忆和自定义工作目录修复。
          - **v1.1.5**：旧缓存页面、MCP SSE 和启动告警修复。
          - **v1.1.4**：笔记元信息、托盘更新检查、B 站下载稳定性和 Whisper 回退改进。
          - **v1.1.3 及更早**：B 站 412 处理、LLM 测试、MCP、任务恢复和多格式导出等基础能力。

          </details>
          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
