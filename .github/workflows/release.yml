name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Verify tag and application version
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          source = Path("launcher.py").read_text(encoding="utf-8")
          match = re.search(r'^VERSION = "([^"]+)"', source, re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read VERSION from launcher.py")
          version = match.group(1)
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag!r} does not match launcher version {version!r}")

      - name: Run tests
        run: python -m pytest

  build-windows:
    name: Build Windows x64
    needs: verify
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install build dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller

      - name: Build portable executable
        shell: pwsh
        run: .\scripts\build_exe.ps1 -Python ((Get-Command python).Source) -SkipInstall

      - name: Read version
        shell: pwsh
        run: |
          $version = (Select-String -Path launcher.py -Pattern '^VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Upload Windows asset
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/VideoToNo-${{ env.VERSION }}-portable.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(cat <<EOF
          ## VideoToNo $GITHUB_REF_NAME

          ### v1.1.4 更新
          - 笔记标题下显示可获得的视频作者、发布时间、时长等元信息，文末追加来源链接、生成模型和笔记风格
          - 三种笔记风格统一参考真实视频元信息，缺失字段省略，不强制固定模板
          - 托盘新增手动检查更新：发现 GitHub 新版本后确认即可打开 Release 页面
          - Whisper 先实际尝试用户选择的模型，下载/加载失败后才降级到已缓存的 base

          ### v1.1.3 更新
          - 修复 B 站下载 412 反爬拦截：改用真实浏览器 UA、Cookie 改走 yt-dlp cookiefile 通道、补齐 buvid/b_nut/b_lsid 风控 Cookie
          - 配置区新增「测试连接」按钮：一键验证 LLM 配置，失败时直接区分 API Key 错误或接口地址错误
          - 前端静态资源 no-cache：发布后刷新页面即用到新版，避免旧缓存导致按钮/功能不生效

          ### v1.1.2 更新
          - 链接输入更宽松：输入框接受 B 站分享文本、无 scheme 的 `b23.tv` 短链与裸 BV/av 号，自动识别补全
          - 全新 3D 产品图标：exe、系统托盘、网页侧栏与 favicon 统一换新
          - DeepSeek 长响应流式读取，推理默认值与请求超时对齐
          - 打包版与 dev 服务可共存：`/api/health` 上报 mode，launcher 仅复用同模式实例，修复 dev 服务占用端口时打包版不驻留托盘
          - README 恢复详细 MCP 接入与 FAQ 指南

          ### v1.1.1 更新
          - 产品页品牌图标统一使用 `sources/icon.png`，处理进度 6 个环节改为等距排列
          - 空正文自动重试提示改为按具体生成阶段即时显示，避免完成后才出现误导性日志
          - 更新配置、处理进度和笔记输出产品截图

          ### 功能
          - 完整的“平台字幕 / B 站 AI 字幕 → Whisper 兜底 → LLM 笔记”处理链，保留真实时间轴
          - 结构化转录复用、断点继续、任务取消、处理计时，笔记自动归档到 workspace/notes
          - 多 Provider / 自定义模型、三种笔记风格、推理强度、可选定时截图
          - 长转录细粒度分块与分层归并，降低上下文压力；生成阶段展示逐段进度
          - 笔记一键复制，导出 Markdown / HTML / JSON / 纯文本 / PNG 长图或分页图片
          - 页面显示当前版本；最近任务可删除失败记录及其本地产物
          - MCP 接入：Cherry Studio（SSE）与 Codex（stdio）；wait_for_task 等待终态，减少轮询
          - MCP 配置持久化：LLM 配置与 B 站凭据保存一次后免传参（明文存 workspace，仅本机可读）
          - 前端依赖本地化（marked / DOMPurify / html2canvas），界面不依赖外网 CDN
          - 亮暗主题、扫码登录导入 B 站凭据、Whisper 模型缓存三态标注

          ### 安全边界
          - 服务默认仅监听回环地址，请勿暴露到公网
          - API Key 默认不落盘；仅显式调用 MCP 保存工具时明文写入 workspace（已 gitignore）
          - B 站扫码登录 Cookie 仅存内存，不落盘
          EOF
          )
          gh release create "$GITHUB_REF_NAME" release-assets/* --notes "$NOTES" --title "VideoToNo $GITHUB_REF_NAME"
